[package]
name = "realistic_physics"
# The version players see in the game and on videos of it; CHANGELOG.md lists
# what each one changed, and README.md's Versions section says when to bump it.
version = "0.10.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0 OR PolyForm-Small-Business-1.0.0"

[lib]
name = "realistic_physics"
path = "src/lib.rs"

[[bin]]
name = "realistic_physics"
path = "src/bin/realistic_physics/main.rs"

[[bin]]
name = "anatomy_diagnostics"
path = "src/bin/anatomy_diagnostics.rs"

[[bin]]
name = "strike_scenarios"
path = "src/bin/strike_scenarios/main.rs"

[[bin]]
name = "visual_damage_diagnostics"
path = "src/bin/visual_damage_diagnostics.rs"

[[bin]]
name = "contact_sheet"
path = "src/bin/contact_sheet.rs"

[[bin]]
name = "see_through"
path = "src/bin/see_through.rs"

[[bin]]
name = "make_icons"
path = "src/bin/make_icons.rs"

[dependencies]
# Trigonometry that comes out the same natively and in the browser; see
# "Check Browser Parity" in README.md.
libm = "0.2.16"
# "audio" plays the game's sound through quad-snd.
macroquad = { version = "0.4", features = ["audio"] }

# quad-snd with lower latency and smooth volume changes; vendor/quad-snd/PATCHES.md
# lists the changes.
[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }
