name: Deploy web build

# Builds the WebAssembly version with tools/build_web.ps1 and publishes it to
# GitHub Pages, so the browser version always matches main, then tags a new
# version the first time it goes live. The site's Fight page is the game built
# on the engine, from its own repository at the version web/fight.version
# names; change that line to change what the Fight page shows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; newer pushes queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Read the Fight page's version
        id: fight
        run: echo "ref=$(tr -d '[:space:]' < web/fight.version)" >> "$GITHUB_OUTPUT"

      - name: Check out the game at that version
        uses: actions/checkout@v7
        with:
          repository: AzizjonKasimov/realistic-physics-fight
          ref: ${{ steps.fight.outputs.ref }}
          path: fight-src

      - name: Build web version
        shell: pwsh
        run: ./tools/build_web.ps1 -Fight fight-src

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The first time a version goes live, tag the commit (v0.7.0), so the game a
  # video showed can be built again: git checkout v0.7.0, or
  # tools/compare.ps1 -Ref v0.7.0. Later deploys of the same version keep it.
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag the version that went live
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already tagged"
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
            echo "Tagged $tag"
          fi
